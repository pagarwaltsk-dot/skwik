name: Build APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which build profile"
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    name: Ask Expo to build it
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up the Expo tools
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check the token is there
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. Settings -> Secrets and variables -> Actions -> New repository secret, named EXPO_TOKEN."
            exit 1
          fi
          eas whoami

      - name: Install the packages
        run: npm ci

      - name: Send the build to Expo
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Where to find it
        run: |
          echo "### The build is now running on Expo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "It takes about 10-20 minutes. The APK and QR code appear here:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/sgstsk/projects/skwik/builds" >> $GITHUB_STEP_SUMMARY
