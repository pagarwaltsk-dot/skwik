name: APK without EAS

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Build it, and say plainly what went wrong if it does
        run: |
          set -o pipefail
          LOG=/tmp/apk.log
          : > "$LOG"

          fail () {
            {
              echo "## The APK was not built"
              echo ""
              echo "**It stopped at: $1**"
              echo ""
              echo '```'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          echo "=== versions ===" | tee -a "$LOG"
          node --version 2>&1 | tee -a "$LOG"
          java -version  2>&1 | tee -a "$LOG"

          echo "" | tee -a "$LOG"
          echo "=== installing the packages ===" | tee -a "$LOG"
          npm ci 2>&1 | tail -n 40 | tee -a "$LOG" || fail "npm ci"

          echo "" | tee -a "$LOG"
          echo "=== making the android folder ===" |
