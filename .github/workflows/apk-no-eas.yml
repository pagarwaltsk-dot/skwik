name: APK without EAS

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android tools
        uses: android-actions/setup-android@v3

      - name: Install the packages
        run: npm ci

      - name: Make the android folder
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find it and name it
        id: find
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::gradle finished but no .apk was produced"
            exit 1
          fi
          VER=$(node -p "require('./app.json').expo.version")
          cp "$APK" "skwik-$VER.apk"
          echo "name=skwik-$VER.apk" >> "$GITHUB_OUTPUT"
          ls -lh "skwik-$VER.apk"

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: skwik-apk
          path: ${{ steps.find.outputs.name }}
          if-no-files-found: error

      - name: Where to find it
        run: |
          {
            echo "## The APK is ready"
            echo ""
            echo "Scroll to the bottom of this page, under **Artifacts**, and"
            echo "download **skwik-apk**. It comes as a zip; the .apk is inside."
          } >> "$GITHUB_STEP_SUMMARY"
